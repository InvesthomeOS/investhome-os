[project]
name = "investhome-api"
version = "0.1.0"
description = "Investhome OS API — FastAPI backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "python-pptx>=1.0.2",
    "chardet>=5.2.0",
    "httpx>=0.28.0",
    "pillow>=11.0.0",
    "cairosvg>=2.7.0",
    "svglib>=1.5.0",
    "reportlab>=4.0.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.36.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
investhome-demo = "investhome_api.db.demo.cli:console_main"
investhome-migrate = "investhome_api.migration.cli:console_main"
investhome-bitrix = "investhome_api.services.crm.bitrix_import:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investhome_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["investhome_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ideogram_live: live Ideogram API calls (requires IDEOGRAM_API_KEY)",
    "gpt_image_live: live GPT Image API calls (requires AI_API_KEY; spends credits)",
]
