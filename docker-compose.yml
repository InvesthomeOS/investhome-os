services:
  postgres:
    image: postgres:16-alpine
    container_name: investhome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investhome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investhome}
      POSTGRES_DB: ${POSTGRES_DB:-investhome}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investhome} -d ${POSTGRES_DB:-investhome}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - investhome-net

  redis:
    image: redis:7-alpine
    container_name: investhome-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - investhome-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: investhome-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-investhome}:${POSTGRES_PASSWORD:-investhome}@postgres:5432/${POSTGRES_DB:-investhome}
      API_ENVIRONMENT: ${API_ENVIRONMENT:-development}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-'["http://localhost:3000"]'}
      DOCUMENT_STORAGE_ROOT: /var/lib/investhome/documents
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_PROCESSING_SYNC: ${DOCUMENT_PROCESSING_SYNC:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_MODEL: ${AI_MODEL:-local-heuristic-v1}
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - investhome-net
    volumes:
      - document_storage:/var/lib/investhome/documents

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: investhome-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-investhome}:${POSTGRES_PASSWORD:-investhome}@postgres:5432/${POSTGRES_DB:-investhome}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_ROOT: /var/lib/investhome/documents
      DOCUMENT_PROCESSING_SYNC: "false"
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_MODEL: ${AI_MODEL:-local-heuristic-v1}
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
    command: ["arq", "investhome_api.worker.settings.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - investhome-net
    volumes:
      - document_storage:/var/lib/investhome/documents

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: investhome-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - investhome-net

  n8n:
    image: n8nio/n8n:latest
    container_name: investhome-n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-investhome}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-investhome}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-investhome}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-32-char-encryption-key}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      GENERIC_TIMEZONE: UTC
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automations/n8n/workflows:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - investhome-net

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  document_storage:

networks:
  investhome-net:
    driver: bridge
