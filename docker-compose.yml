services:
  postgres:
    image: postgres:16-alpine
    container_name: investhome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - investhome-net

  redis:
    image: redis:7-alpine
    container_name: investhome-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - investhome-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: investhome-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      API_ENVIRONMENT: ${API_ENVIRONMENT:-development}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-'["http://localhost:3000","http://127.0.0.1:3000"]'}
      DOCUMENT_STORAGE_ROOT: /var/lib/investhome/documents
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      DOCUMENT_PROCESSING_SYNC: ${DOCUMENT_PROCESSING_SYNC:-false}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_MODEL: ${AI_MODEL:-local-heuristic-v1}
      AI_API_KEY: ${AI_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY:-}
      IDEOGRAM_ENABLED: ${IDEOGRAM_ENABLED:-true}
      IDEOGRAM_MODEL: ${IDEOGRAM_MODEL:-V_4_0}
      IDEOGRAM_DEFAULT_QUALITY: ${IDEOGRAM_DEFAULT_QUALITY:-QUALITY}
      GPT_IMAGE_ENABLED: ${GPT_IMAGE_ENABLED:-true}
      GPT_IMAGE_MODEL: ${GPT_IMAGE_MODEL:-gpt-image-2}
      GPT_IMAGE_QUALITY: ${GPT_IMAGE_QUALITY:-medium}
      CANVA_CLIENT_ID: ${CANVA_CLIENT_ID:-}
      CANVA_CLIENT_SECRET: ${CANVA_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COMMUNICATION_CREDENTIAL_KEY: ${COMMUNICATION_CREDENTIAL_KEY:?COMMUNICATION_CREDENTIAL_KEY is required}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - investhome-net
    volumes:
      - document_storage:/var/lib/investhome/documents

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: investhome-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      DOCUMENT_STORAGE_ROOT: /var/lib/investhome/documents
      DOCUMENT_PROCESSING_SYNC: "false"
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_MODEL: ${AI_MODEL:-local-heuristic-v1}
      AI_API_KEY: ${AI_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY:-}
      IDEOGRAM_ENABLED: ${IDEOGRAM_ENABLED:-true}
      IDEOGRAM_MODEL: ${IDEOGRAM_MODEL:-V_4_0}
      IDEOGRAM_DEFAULT_QUALITY: ${IDEOGRAM_DEFAULT_QUALITY:-QUALITY}
      GPT_IMAGE_ENABLED: ${GPT_IMAGE_ENABLED:-true}
      GPT_IMAGE_MODEL: ${GPT_IMAGE_MODEL:-gpt-image-2}
      GPT_IMAGE_QUALITY: ${GPT_IMAGE_QUALITY:-medium}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COMMUNICATION_CREDENTIAL_KEY: ${COMMUNICATION_CREDENTIAL_KEY:?COMMUNICATION_CREDENTIAL_KEY is required}
    command: ["arq", "investhome_api.worker.settings.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - investhome-net
    volumes:
      - document_storage:/var/lib/investhome/documents

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: investhome-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET:?PORTAL_SESSION_SECRET is required}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - investhome-net

  n8n:
    image: n8nio/n8n:latest
    container_name: investhome-n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      GENERIC_TIMEZONE: UTC
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automations/n8n/workflows:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - investhome-net

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  document_storage:

networks:
  investhome-net:
    driver: bridge
